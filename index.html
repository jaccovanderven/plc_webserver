<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.png">
<title>LiveLink</title>
<style>
  /* Bosman van Zaal huisstijl */
  :root {
    --navy: #1E2A44; --oranje: #E8622A; --licht: #EEF1F6;
    --tekst: #444444; --muted: #7a8599; --wit: #ffffff; --rand: #d9dee8;
    --ok: #2e8b57; --fout: #c0392b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--licht); color: var(--tekst);
         font-family: Calibri, Carlito, "Segoe UI", sans-serif; }

  header { background: var(--wit); border-bottom: 3px solid var(--oranje); }
  .kop { max-width: 820px; margin: 0 auto; padding: 14px 16px;
         display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .kop img { display: block; }
  h1.logo { margin: 0; }
  h1.logo img { height: 68px; margin-left: -4px; }
  .kop .bvz { height: 68px; }

  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 40px; }
  .sub { color: var(--oranje); font-style: italic; font-size: 1.1rem; margin: 6px 0 0; }

  @media (max-width: 520px) { h1.logo img { height: 48px; } .kop .bvz { height: 44px; } }

  .kies { display: block; color: var(--navy); font-weight: 700; margin-bottom: 6px; }
  select { width: 100%; max-width: 420px; font: inherit; font-size: 1.1rem; color: var(--navy);
           padding: 8px 12px; border: 1px solid var(--rand); border-radius: 4px; background: var(--wit); }
  select:focus-visible { outline: 2px solid var(--oranje); outline-offset: 1px; }

  .card { background: var(--wit); border: 1px solid var(--rand); border-radius: 6px; max-width: 420px;
          margin-top: 20px; overflow: hidden; display: flex; flex-direction: column; }
  .card .titel { background: var(--navy); color: var(--wit); font-weight: 700;
                 padding: 8px 16px; font-size: 1.1rem; letter-spacing: .02em; }
  .card .inhoud { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .oms { color: var(--navy); font-size: 1.1rem; }
  .regel { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .95rem; }
  /* PLC's/HMI's als raster: stip | naam | IP | status, zodat de IP-adressen onder elkaar staan */
  .apparaten { display: grid; grid-template-columns: auto auto auto 1fr; align-items: center;
               column-gap: 8px; row-gap: 10px; color: var(--muted); font-size: .95rem; }
  .apparaten:empty { display: none; }
  .apparaten .addr { justify-self: start; }
  .addr { background: var(--licht); color: var(--navy); padding: 2px 8px; border-radius: 4px;
          font-family: Consolas, ui-monospace, monospace; font-size: .9rem; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--rand); flex: none; }
  .dot.aan { background: var(--ok); }
  .dot.uit { background: var(--fout); }
  .st { margin-left: auto; font-size: .9rem; }
  .st.uit { color: var(--fout); }
  .knop { margin-top: auto; align-self: flex-start; display: block; text-align: center; text-decoration: none;
          background: var(--oranje); color: var(--wit); font-weight: 700; font-size: 1.05rem;
          padding: 10px 16px; border-radius: 4px; }
  .knop:hover, .knop:focus-visible { background: #cf5321; }
  .knoppen { margin-top: auto; display: flex; flex-wrap: wrap; gap: 8px; }
  .knoppen:not(:has(.knop)) { display: none; }   /* alles offline: geen lege knoppenrij */
  button.knop { font: inherit; font-weight: 700; font-size: 1.05rem; border: 0; cursor: pointer; }
  .knop.tweede { background: var(--navy); }
  .knop.tweede:hover, .knop.tweede:focus-visible { background: #2c3b5e; }
  .melding { color: var(--fout); font-size: .95rem; }
  .melding:empty { display: none; }
  .leeg, .fout { padding: 16px; background: var(--wit); border: 1px solid var(--rand); border-radius: 6px; }
  .fout { color: var(--fout); }
  .versie { margin-top: 32px; color: var(--muted); font-size: .85rem; }

  .about-link { font: inherit; color: var(--navy); background: none; border: 0; padding: 0;
                cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .about-link:hover, .about-link:focus-visible { color: var(--oranje); }

  dialog#about { width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 64px); padding: 0;
                 border: 1px solid var(--rand); border-top: 4px solid var(--oranje); border-radius: 6px;
                 color: var(--tekst); font-family: inherit; }
  dialog#about::backdrop { background: rgba(30, 42, 68, .45); }
  dialog#about[open] { display: flex; flex-direction: column; }
  .about-kop { display: flex; align-items: center; gap: 14px; padding: 18px 20px 0; }
  .about-kop img { width: 48px; height: 48px; }
  .about-kop h2 { margin: 0; color: var(--navy); font-size: 1.5rem; }
  .about-meta { color: var(--muted); font-size: .95rem; }
  .about-tekst { margin: 12px 20px 0; }
  .about-tekst a { color: var(--navy); font-weight: 700; }
  .about-tekst a:hover { color: var(--oranje); }
  dialog#about h3 { margin: 16px 20px 6px; color: var(--navy); font-size: 1.05rem; }
  .about-lijst { overflow-y: auto; padding: 0 20px; border-top: 1px solid var(--rand); }
  .about-versie { padding: 10px 0; border-bottom: 1px solid var(--rand); }
  .about-versie b { color: var(--navy); }
  .about-versie .datum { color: var(--muted); font-size: .9rem; margin-left: 6px; }
  .about-versie ul { margin: 4px 0 0; padding-left: 20px; }
  .about-versie.huidig b { color: var(--oranje); }
  dialog#about form { padding: 14px 20px 18px; margin: 0; }
  dialog#about form .knop { margin: 0; border: 0; cursor: pointer; font: inherit; font-weight: 700; }
</style>
</head>
<body>
<header>
  <div class="kop">
    <h1 class="logo"><img src="livelink_logo.svg" alt="LiveLink"></h1>
    <img class="bvz" src="logo.png" alt="Bosman van Zaal">
  </div>
</header>

<dialog id="about" aria-labelledby="about-titel">
  <div class="about-kop">
    <img src="livelink_icon.svg" alt="">
    <div>
      <h2 id="about-titel">LiveLink</h2>
      <div class="about-meta" id="about-meta"></div>
    </div>
  </div>
  <p class="about-tekst">Live uitlezen van Omron-PLC's per project via FINS, met online-status van PLC's en HMI's en VNC naar de HMI.</p>
  <p class="about-tekst"><a href="https://www.bosmanvanzaal.com" target="_blank" rel="noopener">www.bosmanvanzaal.com</a></p>
  <h3>Wijzigingen per versie</h3>
  <div class="about-lijst" id="about-lijst"></div>
  <form method="dialog"><button class="knop">Sluiten</button></form>
</dialog>

<main>
  <label class="kies" for="klant">Project</label>
  <select id="klant"><option value="">Laden…</option></select>
  <div class="sub">Kies een project om de live PLC-gegevens te bekijken</div>
  <div id="details"></div>
  <div class="versie"><span id="versie"></span> · <button type="button" class="about-link" id="about-knop">About</button></div>
</main>

<script>
  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const keuze = document.getElementById("klant");
  const doel = document.getElementById("details");
  let klanten = [];

  function toon() {
    const k = klanten.find(x => x.sleutel === keuze.value);
    try { localStorage.setItem("klant", keuze.value); } catch (e) {}
    if (!k) { doel.innerHTML = ""; return; }
    doel.innerHTML = `
      <div class="card">
        <div class="titel">${esc(k.naam)}</div>
        <div class="inhoud">
          ${k.omschrijving ? `<div class="oms">${esc(k.omschrijving)}</div>` : ""}
          ${k.plcs.length ? "" : `<div class="regel">Nog geen PLC's ingesteld</div>`}
          <div class="apparaten">${[...k.plcs, ...k.vnc].sort((a, b) => ipSleutel(a.ip).localeCompare(ipSleutel(b.ip))).map(p => `
            <span class="dot ${p.online === true ? "aan" : p.online === false ? "uit" : ""}"></span><span class="pnaam">${esc(p.naam)}</span><span class="addr">${esc(p.ip)}</span><span class="st ${p.online === false ? "uit" : ""}">${p.online === true ? "online" : p.online === false ? "offline" : "…"}</span>`).join("")}</div>
          <div class="knoppen">
            ${k.plcs.some(p => p.online) ? `<a class="knop" href="/klant/${encodeURIComponent(k.sleutel)}/">Monitor</a>` : ""}
            ${k.vnc.filter(v => v.online).map(v => `<button type="button" class="knop tweede" data-vnc="${esc(v.sleutel)}">VNC ${esc(v.naam)}</button>`).join("")}
          </div>
          <div class="melding" role="status">${esc(melding)}</div>
        </div>
      </div>`;
    doel.querySelectorAll("[data-vnc]").forEach(b => b.addEventListener("click", () => openVnc(k, b.dataset.vnc)));
  }

  let melding = "";   // blijft staan bij het verversen (elke 5 s)

  const ipSleutel = ip => String(ip).split(".").map(n => n.padStart(3, "0")).join(".");   // numeriek sorteren op IP

  async function openVnc(k, vnc) {
    try {
      const r = await fetch(`/klant/${encodeURIComponent(k.sleutel)}/vnc/${encodeURIComponent(vnc)}`, { method: "POST" });
      const d = r.ok ? await r.json() : { ok: false, fout: `HTTP ${r.status}` };
      melding = d.ok ? "" : `VNC starten mislukt: ${d.fout}`;
    } catch (e) {
      melding = `Server niet bereikbaar: ${e.message}`;
    }
    toon();
  }

  async function laad() {
    try {
      const r = await fetch("/api/klanten", { cache: "no-store" });
      klanten = await r.json();
      if (!klanten.length) {
        keuze.disabled = true;
        doel.innerHTML = '<div class="leeg">Nog geen projecten. Voeg een map met klant.py toe in <code>_webserver\\klanten</code>.</div>';
        return;
      }
      let gekozen = keuze.value;
      if (keuze.options[0].text === "Laden…") {   // eerste keer: lijst vullen
        try { gekozen = localStorage.getItem("klant") || ""; } catch (e) {}
        keuze.innerHTML = '<option value="">— kies een project —</option>' +
          klanten.map(k => `<option value="${esc(k.sleutel)}">${esc(k.naam)}</option>`).join("");
      }
      keuze.value = klanten.some(k => k.sleutel === gekozen) ? gekozen : "";
      toon();
    } catch (e) {
      doel.innerHTML = `<div class="fout">Server niet bereikbaar: ${esc(e.message)}</div>`;
    }
  }

  keuze.addEventListener("change", () => { melding = ""; toon(); });
  const datumNl = s => new Date(s + "T12:00").toLocaleDateString("nl-NL", { day: "numeric", month: "long", year: "numeric" });

  fetch("/api/about").then(r => r.json()).then(a => {
    document.getElementById("versie").textContent = `${a.naam} v${a.versie}`;
    document.getElementById("about-meta").textContent = `Versie ${a.versie} · ${a.bedrijf} · ${a.maker}`;
    document.getElementById("about-lijst").innerHTML = a.changelog.map((v, i) => `
      <div class="about-versie${i === 0 ? " huidig" : ""}">
        <b>v${esc(v.versie)}</b><span class="datum">${esc(datumNl(v.datum))}${i === 0 ? " · huidige versie" : ""}</span>
        <ul>${v.wijzigingen.map(w => `<li>${esc(w.replace(/\*\*/g, "").replace(/`/g, ""))}</li>`).join("")}</ul>
      </div>`).join("");
  }).catch(() => {});
  document.getElementById("about-knop").addEventListener("click", () => document.getElementById("about").showModal());
  laad();
  setInterval(laad, 5000);
</script>
</body>
</html>

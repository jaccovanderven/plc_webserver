<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.png">
<title>PLC Webserver</title>
<style>
  /* Bosman van Zaal huisstijl */
  :root {
    --navy: #1E2A44; --oranje: #E8622A; --licht: #EEF1F6;
    --tekst: #444444; --muted: #7a8599; --wit: #ffffff; --rand: #d9dee8;
    --ok: #2e8b57; --fout: #c0392b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--licht); color: var(--tekst);
         font-family: Calibri, Carlito, "Segoe UI", sans-serif; }

  header { background: var(--wit); border-bottom: 3px solid var(--oranje); }
  .kop { max-width: 820px; margin: 0 auto; padding: 14px 16px;
         display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .kop img { height: 68px; display: block; }
  .kop .web { color: var(--muted); font-size: .95rem; }

  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { color: var(--navy); font-size: 2rem; font-weight: 700; margin: 0; }
  .sub { color: var(--oranje); font-style: italic; font-size: 1.1rem; margin: 2px 0 20px; }

  @media (max-width: 520px) { .kop .web { display: none; } }

  .kies { display: block; color: var(--navy); font-weight: 700; margin-bottom: 6px; }
  select { width: 100%; max-width: 420px; font: inherit; font-size: 1.1rem; color: var(--navy);
           padding: 8px 12px; border: 1px solid var(--rand); border-radius: 4px; background: var(--wit); }
  select:focus-visible { outline: 2px solid var(--oranje); outline-offset: 1px; }

  .card { background: var(--wit); border: 1px solid var(--rand); border-radius: 6px; max-width: 420px;
          margin-top: 20px; overflow: hidden; display: flex; flex-direction: column; }
  .card .titel { background: var(--navy); color: var(--wit); font-weight: 700;
                 padding: 8px 16px; font-size: 1.1rem; letter-spacing: .02em; }
  .card .inhoud { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .oms { color: var(--navy); font-size: 1.1rem; }
  .regel { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .95rem; }
  .addr { background: var(--licht); color: var(--navy); padding: 2px 8px; border-radius: 4px;
          font-family: Consolas, ui-monospace, monospace; font-size: .9rem; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--rand); flex: none; }
  .dot.aan { background: var(--ok); }
  .dot.uit { background: var(--fout); }
  .st { margin-left: auto; font-size: .9rem; }
  .st.uit { color: var(--fout); }
  .knop { margin-top: auto; align-self: flex-start; display: block; text-align: center; text-decoration: none;
          background: var(--oranje); color: var(--wit); font-weight: 700; font-size: 1.05rem;
          padding: 10px 16px; border-radius: 4px; }
  .knop:hover, .knop:focus-visible { background: #cf5321; }
  .knoppen { margin-top: auto; display: flex; flex-wrap: wrap; gap: 8px; }
  .knoppen:not(:has(.knop)) { display: none; }   /* alles offline: geen lege knoppenrij */
  button.knop { font: inherit; font-weight: 700; font-size: 1.05rem; border: 0; cursor: pointer; }
  .knop.tweede { background: var(--navy); }
  .knop.tweede:hover, .knop.tweede:focus-visible { background: #2c3b5e; }
  .melding { color: var(--fout); font-size: .95rem; }
  .melding:empty { display: none; }
  .leeg, .fout { padding: 16px; background: var(--wit); border: 1px solid var(--rand); border-radius: 6px; }
  .fout { color: var(--fout); }
  .versie { margin-top: 32px; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<header>
  <div class="kop">
    <img src="logo.png" alt="Bosman van Zaal">
    <span class="web">www.bosmanvanzaal.com</span>
  </div>
</header>

<main>
  <h1>PLC Webserver</h1>
  <div class="sub">Kies een klant om de live PLC-gegevens te bekijken</div>
  <label class="kies" for="klant">Klant</label>
  <select id="klant"><option value="">Laden…</option></select>
  <div id="details"></div>
  <div class="versie" id="versie"></div>
</main>

<script>
  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const keuze = document.getElementById("klant");
  const doel = document.getElementById("details");
  let klanten = [];

  function toon() {
    const k = klanten.find(x => x.sleutel === keuze.value);
    try { localStorage.setItem("klant", keuze.value); } catch (e) {}
    if (!k) { doel.innerHTML = ""; return; }
    doel.innerHTML = `
      <div class="card">
        <div class="titel">${esc(k.naam)}</div>
        <div class="inhoud">
          ${k.omschrijving ? `<div class="oms">${esc(k.omschrijving)}</div>` : ""}
          ${k.plcs.length ? "" : `<div class="regel">Nog geen PLC's ingesteld</div>`}
          ${[...k.plcs, ...k.vnc].map(p => `
          <div class="regel"><span class="dot ${p.online === true ? "aan" : p.online === false ? "uit" : ""}"></span>${esc(p.naam)}<span class="addr">${esc(p.ip)}</span><span class="st ${p.online === false ? "uit" : ""}">${p.online === true ? "online" : p.online === false ? "offline" : "…"}</span></div>`).join("")}
          <div class="knoppen">
            ${k.plcs.some(p => p.online) ? `<a class="knop" href="/klant/${encodeURIComponent(k.sleutel)}/">Insights</a>` : ""}
            ${k.vnc.filter(v => v.online).map(v => `<button type="button" class="knop tweede" data-vnc="${esc(v.sleutel)}">VNC ${esc(v.naam)}</button>`).join("")}
          </div>
          <div class="melding" role="status">${esc(melding)}</div>
        </div>
      </div>`;
    doel.querySelectorAll("[data-vnc]").forEach(b => b.addEventListener("click", () => openVnc(k, b.dataset.vnc)));
  }

  let melding = "";   // blijft staan bij het verversen (elke 5 s)

  async function openVnc(k, vnc) {
    try {
      const r = await fetch(`/klant/${encodeURIComponent(k.sleutel)}/vnc/${encodeURIComponent(vnc)}`, { method: "POST" });
      const d = r.ok ? await r.json() : { ok: false, fout: `HTTP ${r.status}` };
      melding = d.ok ? "" : `VNC starten mislukt: ${d.fout}`;
    } catch (e) {
      melding = `Server niet bereikbaar: ${e.message}`;
    }
    toon();
  }

  async function laad() {
    try {
      const r = await fetch("/api/klanten", { cache: "no-store" });
      klanten = await r.json();
      if (!klanten.length) {
        keuze.disabled = true;
        doel.innerHTML = '<div class="leeg">Nog geen klanten. Voeg een map met klant.py toe in <code>_webserver\\klanten</code>.</div>';
        return;
      }
      let gekozen = keuze.value;
      if (keuze.options[0].text === "Laden…") {   // eerste keer: lijst vullen
        try { gekozen = localStorage.getItem("klant") || ""; } catch (e) {}
        keuze.innerHTML = '<option value="">— kies een klant —</option>' +
          klanten.map(k => `<option value="${esc(k.sleutel)}">${esc(k.naam)}</option>`).join("");
      }
      keuze.value = klanten.some(k => k.sleutel === gekozen) ? gekozen : "";
      toon();
    } catch (e) {
      doel.innerHTML = `<div class="fout">Server niet bereikbaar: ${esc(e.message)}</div>`;
    }
  }

  keuze.addEventListener("change", () => { melding = ""; toon(); });
  fetch("/api/versie").then(r => r.json())
    .then(d => document.getElementById("versie").textContent = `PLC Webserver v${d.versie}`)
    .catch(() => {});
  laad();
  setInterval(laad, 5000);
</script>
</body>
</html>

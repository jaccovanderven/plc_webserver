<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.png">
<title>Green Circle Growers</title>
<style>
  /* Bosman van Zaal huisstijl */
  :root {
    --navy: #1E2A44; --oranje: #E8622A; --licht: #EEF1F6;
    --tekst: #444444; --muted: #7a8599; --wit: #ffffff; --rand: #d9dee8;
    --ok: #2e8b57; --fout: #c0392b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--licht); color: var(--tekst);
         font-family: Calibri, Carlito, "Segoe UI", sans-serif; }

  header { background: var(--wit); border-bottom: 3px solid var(--oranje); }
  .kop { max-width: 1200px; margin: 0 auto; padding: 14px 16px;
         display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .kop img { height: 68px; display: block; }
  .kop .ll { margin-left: -4px; }
  @media (max-width: 520px) { .kop .ll { height: 48px; } .kop .bvz { height: 44px; } }
  .terug { display: inline-block; margin-bottom: 8px; color: var(--navy); font-weight: 700; text-decoration: none; }
  .terug:hover, .terug:focus-visible { color: var(--oranje); }

  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { color: var(--navy); font-size: 2rem; font-weight: 700; margin: 0; }
  .sub { color: var(--oranje); font-style: italic; font-size: 1.1rem; margin: 2px 0 20px; }

  .card { background: var(--wit); border: 1px solid var(--rand); border-radius: 6px; overflow: hidden; }
  .card .titel { background: var(--navy); color: var(--wit); font-weight: 700;
                 padding: 8px 16px; font-size: 1.1rem; letter-spacing: .02em; }
  .scroll { overflow-x: auto; }

  table { border-collapse: collapse; width: 100%; min-width: 980px; font-size: 1rem; }
  th, td { padding: 5px 8px; text-align: center; white-space: nowrap; }
  thead th { color: var(--navy); font-weight: 700; background: var(--licht); line-height: 1.15; }
  thead tr:last-child th { border-bottom: 2px solid var(--oranje); font-weight: 400; color: var(--muted); font-size: .9rem; }
  tbody tr { border-bottom: 1px solid var(--rand); }
  tbody tr:last-child { border-bottom: 0; }
  tbody tr:hover { background: #f7f9fc; }
  td.pos, th.pos { text-align: left; }
  td.pos .nr { display: inline-block; width: 1.6em; text-align: right; color: var(--muted); }
  td.pos .y { font-weight: 700; color: var(--navy); margin: 0 6px; }
  .groep { border-left: 1px solid var(--rand); }
  .getal { font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }

  .bit { display: inline-block; width: 14px; height: 14px; border-radius: 50%;
         background: var(--wit); border: 2px solid var(--rand); vertical-align: middle; }
  .bit.aan { background: var(--ok); border-color: var(--ok); }
  .badge { display: inline-block; min-width: 62px; padding: 1px 8px; border-radius: 4px;
           font-size: .9rem; font-weight: 700; border: 1px solid var(--rand); color: var(--muted); background: var(--wit); }
  .badge.schoon { color: var(--ok); border-color: var(--ok); }
  .badge.vuil { color: var(--wit); background: var(--oranje); border-color: var(--oranje); }
  .badge.aan { color: var(--wit); background: var(--ok); border-color: var(--ok); }

  .legenda { margin-top: 10px; color: var(--muted); font-size: .9rem; }
  .status { margin-top: 14px; font-size: .95rem; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--rand); flex: none; }
  .status.ok .dot { background: var(--ok); }
  .status.fout .dot { background: var(--fout); }
  .status.fout { color: var(--fout); }
</style>
</head>
<body>
<header>
  <div class="kop">
    <a class="home" href="/" title="Alle projecten"><img class="ll" src="/livelink_logo.svg" alt="LiveLink"></a>
    <img class="bvz" src="/logo.png" alt="Bosman van Zaal">
  </div>
</header>

<main>
  <a class="terug" href="/">&larr; Alle projecten</a>
  <h1>Green Circle Growers</h1>
  <div class="sub" id="sub">Live, ververst elke seconde</div>

  <div class="card">
    <div class="titel">Posities</div>
    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th class="pos" rowspan="2">Positie</th>
            <th class="groep" colspan="2">Prioriteit</th>
            <th class="groep" colspan="2">Oppakken</th>
            <th class="groep" colspan="2">Neerzetten</th>
            <th class="groep" rowspan="2">Schoon/vuil</th>
            <th class="groep" rowspan="2">Aantal op<br>stapel</th>
            <th class="groep" colspan="4">Opslag</th>
          </tr>
          <tr>
            <th class="groep">OHC 1</th><th>OHC 2</th>
            <th class="groep">actief</th><th>beschikbaar</th>
            <th class="groep">actief</th><th>beschikbaar</th>
            <th class="groep">Naar</th><th>Van</th><th>103</th><th>102</th>
          </tr>
        </thead>
        <tbody id="rijen"></tbody>
      </table>
    </div>
  </div>
  <div class="legenda">Alleen lezen. Houd de muis op een waarde voor het PLC-adres.</div>
  <div class="status" id="status"><span class="dot"></span><span id="stekst">Verbinden…</span></div>
</main>

<script>
  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  // kolommen: [sleutel, soort, begin van een groep]
  const KOLOMMEN = [
    ["prio1", "getal", true], ["prio2", "getal", false],
    ["oppakken_actief", "bit", true], ["oppakken_beschikbaar", "bit", false],
    ["neerzetten_actief", "bit", true], ["neerzetten_beschikbaar", "bit", false],
    ["vuil", "vuil", true], ["aantal", "getal", true],
    ["opslag_naar", "knop:Naar", true], ["opslag_van", "knop:Van", false],
    ["opslag_103", "bit", false], ["opslag_102", "bit", false],
  ];

  function cel(v, soort) {
    if (!v) return "";
    const t = ` title="${esc(v.adres)}"`;
    if (soort === "getal") return `<span class="getal"${t}>${esc(v.waarde)}</span>`;
    if (soort === "bit") return `<span class="bit${v.waarde ? " aan" : ""}"${t}></span>`;
    if (soort === "vuil") return `<span class="badge ${v.waarde ? "vuil" : "schoon"}"${t}>${v.waarde ? "Vuil" : "Schoon"}</span>`;
    return `<span class="badge${v.waarde ? " aan" : ""}"${t}>${esc(soort.split(":")[1])}</span>`;
  }

  function teken(rijen) {
    document.getElementById("rijen").innerHTML = rijen.map(r => `
      <tr>
        <td class="pos"><span class="nr">${esc(r.nr)}</span><span class="y">${esc(r.y)}</span>${esc(r.naam)}</td>
        ${KOLOMMEN.map(([s, soort, groep]) =>
          `<td${groep ? ' class="groep"' : ""}>${cel(r[s], soort)}</td>`).join("")}
      </tr>`).join("");
  }

  async function ververs() {
    const status = document.getElementById("status");
    const tekst = document.getElementById("stekst");
    try {
      const r = await fetch("api/master/overzicht", { cache: "no-store" });
      const d = await r.json();
      if (!d.ok) throw new Error(d.fout);
      teken(d.rijen);
      status.className = "status ok";
      tekst.textContent = `Verbonden · laatste update ${d.tijd}`;
    } catch (e) {
      status.className = "status fout";
      tekst.textContent = `Geen verbinding: ${e.message}`;
    }
    setTimeout(ververs, 1000);
  }

  async function start() {
    const info = await (await fetch("info", { cache: "no-store" })).json();
    const p = info.plcs.find(x => x.sleutel === "master");
    document.getElementById("sub").textContent = `${p.naam} ${p.ip} · live, ververst elke seconde`;
    ververs();
  }

  start();
</script>
</body>
</html>

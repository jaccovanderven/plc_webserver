<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.png">
<title>Green Circle Growers</title>
<style>
  /* Bosman van Zaal huisstijl */
  :root {
    --navy: #1E2A44; --oranje: #E8622A; --licht: #EEF1F6;
    --tekst: #444444; --muted: #7a8599; --wit: #ffffff; --rand: #d9dee8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--licht); color: var(--tekst);
         font-family: Calibri, Carlito, "Segoe UI", sans-serif; }

  header { background: var(--wit); border-bottom: 3px solid var(--oranje); }
  .kop { max-width: 820px; margin: 0 auto; padding: 14px 16px;
         display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .kop img { height: 68px; display: block; }
  .kop .ll { margin-left: -4px; }
  @media (max-width: 520px) { .kop .ll { height: 48px; } .kop .bvz { height: 44px; } }
  .terug { display: inline-block; margin-bottom: 8px; color: var(--navy); font-weight: 700; text-decoration: none; }
  .terug:hover, .terug:focus-visible { color: var(--oranje); }

  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { color: var(--navy); font-size: 2rem; font-weight: 700; margin: 0; }
  .sub { color: var(--oranje); font-style: italic; font-size: 1.1rem; margin: 2px 0 20px; }

  .card { background: var(--wit); border: 1px solid var(--rand); border-radius: 6px; overflow: hidden; }
  .card .titel { background: var(--navy); color: var(--wit); font-weight: 700;
                 padding: 8px 16px; font-size: 1.1rem; letter-spacing: .02em; }
  .card .inhoud { padding: 16px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="kop">
    <a class="home" href="/" title="Alle projecten"><img class="ll" src="/livelink_logo.svg" alt="LiveLink"></a>
    <img class="bvz" src="/logo.png" alt="Bosman van Zaal">
  </div>
</header>

<main>
  <a class="terug" href="/">&larr; Alle projecten</a>
  <h1>Green Circle Growers</h1>
  <div class="sub">Nog geen live data</div>
  <div class="card">
    <div class="titel">Monitor</div>
    <div class="inhoud">Er zijn nog geen adressen ingesteld om uit te lezen.</div>
  </div>
</main>
</body>
</html>
